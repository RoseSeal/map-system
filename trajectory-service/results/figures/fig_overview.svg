<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Heiti TC, Microsoft YaHei, sans-serif">
  <style>
    .box { fill:#f4f7fb; stroke:#3b5b8c; stroke-width:1.6; rx:10; }
    .res { fill:#eaf7ee; stroke:#2e9e54; stroke-width:2; rx:10; }
    .sys { fill:#fbf6ea; stroke:#b5882e; stroke-width:1.6; stroke-dasharray:6 4; rx:10; }
    .t { fill:#1b2a44; font-size:16px; font-weight:600; text-anchor:middle; }
    .s { fill:#46566f; font-size:12.5px; text-anchor:middle; }
    .cv { fill:#8a93a3; font-size:13px; text-anchor:middle; }
    .gru { fill:#2e9e54; font-size:13.5px; font-weight:700; text-anchor:middle; }
    .arr { stroke:#3b5b8c; stroke-width:2; fill:none; marker-end:url(#a); }
    .arrd { stroke:#b5882e; stroke-width:1.8; fill:none; stroke-dasharray:6 4; marker-end:url(#ad); }
    .title { fill:#11203a; font-size:21px; font-weight:700; text-anchor:middle; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3b5b8c"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b5882e"/></marker>
  </defs>

  <text x="590" y="40" class="title">方法总览：真实内河 AIS 轨迹预测 → 碰撞风险评估升级</text>

  <!-- 主流水线 6 框 -->
  <rect class="box" x="15"  y="95" width="165" height="115" rx="10"/>
  <text x="97"  y="130" class="t">真实 AIS</text>
  <text x="97"  y="155" class="s">NBSDC 武汉长江</text>
  <text x="97"  y="176" class="s">完全共享</text>
  <text x="97"  y="197" class="s">1,373 万行</text>

  <rect class="box" x="210" y="95" width="165" height="115" rx="10"/>
  <text x="292" y="130" class="t">清洗 · 切段</text>
  <text x="292" y="155" class="s">12,265 段 / 4,382 船</text>
  <text x="292" y="176" class="s">~153s 真实节奏</text>
  <text x="292" y="197" class="s">不插值</text>

  <rect class="box" x="405" y="95" width="165" height="115" rx="10"/>
  <text x="487" y="135" class="t">窗口化</text>
  <text x="487" y="162" class="s">输入 10 个观测点</text>
  <text x="487" y="183" class="s">→ 未来第 1/2/3 点</text>

  <rect class="box" x="600" y="95" width="165" height="115" rx="10"/>
  <text x="682" y="128" class="t">轨迹预测</text>
  <text x="682" y="158" class="cv">CV 恒速基线（LSQ）</text>
  <text x="682" y="184" class="gru">GRU 学习预测</text>

  <rect class="box" x="795" y="95" width="165" height="115" rx="10"/>
  <text x="877" y="135" class="t">CPA / TCPA</text>
  <text x="877" y="162" class="s">碰撞风险评估</text>
  <text x="877" y="183" class="s">会遇风险分级</text>

  <rect class="res" x="990" y="95" width="175" height="115" rx="10"/>
  <text x="1077" y="128" class="t">结果（测试集）</text>
  <text x="1077" y="156" class="s">FDE −28%（弯道 −33%）</text>
  <text x="1077" y="180" class="s">真危险漏报</text>
  <text x="1077" y="200" class="s">12.2% → 8.6%</text>

  <!-- 主箭头 -->
  <path class="arr" d="M180,152 L208,152"/>
  <path class="arr" d="M375,152 L403,152"/>
  <path class="arr" d="M570,152 L598,152"/>
  <path class="arr" d="M765,152 L793,152"/>
  <path class="arr" d="M960,152 L988,152"/>

  <!-- 落地载体 -->
  <rect class="sys" x="405" y="300" width="555" height="78" rx="10"/>
  <text x="682" y="332" class="t">落地载体：map-system 实时态势与碰撞风险系统</text>
  <text x="682" y="360" class="s">演示系统能力（当前预测层为 CV）；将 GRU 集成进实时链路为下一步工作</text>
  <path class="arrd" d="M682,300 L682,212"/>
</svg>
